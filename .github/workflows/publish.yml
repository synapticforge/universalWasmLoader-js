name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      # NOTE: every step is a plain `run:` step. Under the first owner (`jrmarcum`) a third-party
      # `uses:` meant a `startup_failure` with no step run (v1.0.6, 2026-06-15). The repo is in the
      # `synapticforge1` organization since 2026-10-21, with the same policy as binaryang there
      # (owner); `run:` steps work under any policy.
      # Full history and tags (no --depth): the compatibility gate compares with the previous tag.
      - name: Checkout
        run: |
          git clone --branch ${{ github.ref_name }} \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} .

      # jsr.json is the package manifest since the Bun migration (2026-10-12; deno.json before).
      - name: Verify jsr.json version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(jq -r .version jsr.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match jsr.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Versions match: $TAG_VERSION"

      # The gate is CI's `gates` job, on Bun (the project's runtime since 2026-10-12).
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.3"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Gate (types, lint, manifest, surface, fixtures, browser, tests)
        run: |
          bun install --frozen-lockfile
          bun run gate

      # The compatibility gate on the tagged commit (letter H6): the jsr.json bump since the
      # previous tag must meet the surface floor, and for a patch/minor the previous tag's tests
      # must pass against this source. A failure here stops the publish.
      - name: Compatibility gate (release)
        run: bun run compat --release

      # Publishing to JSR still needs Deno: `bunx jsr publish` downloads Deno and runs
      # `deno publish` as a subprocess, which skips the type check when a package.json exists
      # and is the kind of indirection that has lost OIDC provenance before. So Deno is
      # installed here and `deno publish` is called DIRECTLY. With no deno.json in the repo it
      # reads jsr.json on its own.
      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      # Provenance requires a GitHub OIDC token. The `id-token: write` permission
      # above is what injects ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN into the runner.
      # If they are absent here despite the permission, an org/enterprise Actions
      # OIDC policy is blocking the token and `deno publish` will silently skip
      # provenance (publish still succeeds). This checks a PREREQUISITE, not the
      # outcome: the last step below is the real check.
      - name: Check OIDC availability (provenance prerequisite)
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC token endpoint available — provenance prerequisites met."
          else
            echo "::warning::OIDC token NOT available (URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}, TOKEN present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}). deno publish will skip provenance. Verify id-token:write is honored — check org/enterprise Settings → Actions → General OIDC policy."
          fi

      - name: Publish to JSR
        run: deno publish

      - name: Create release branch
        run: |
          git checkout -b release/${GITHUB_REF_NAME}
          git push origin release/${GITHUB_REF_NAME}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${GITHUB_REF_NAME} \
            --title "${GITHUB_REF_NAME}" \
            --target release/${GITHUB_REF_NAME} \
            --generate-notes

      # THE evidence of provenance (design from binaryang/wasmtk): a green publish is not
      # proof, because `deno publish` skips attestation non-fatally. Runs LAST: JSR versions
      # are immutable, so this surfaces a problem loudly without blocking the release.
      # JSR caches this endpoint, so every read is cache-busted.
      - name: Verify provenance was recorded on JSR
        run: |
          PKG="$(jq -r .name jsr.json)"
          SCOPE=${PKG%/*}; SCOPE=${SCOPE#@}
          NAME=${PKG#*/}
          VERSION=${GITHUB_REF_NAME#v}
          URL="https://api.jsr.io/scopes/${SCOPE}/packages/${NAME}/versions/${VERSION}"
          echo "Checking $URL"
          for i in $(seq 1 12); do
            BODY=$(curl -sf -H "Accept: application/json" -H "Cache-Control: no-cache" "${URL}?cb=${GITHUB_RUN_ID}-${i}" || true)
            REKOR=$(printf '%s' "$BODY" | jq -r '.rekorLogId // empty' 2>/dev/null || true)
            if [ -n "$REKOR" ]; then
              echo "Provenance recorded — Rekor log ID: $REKOR"
              echo "- provenance recorded, Rekor log ID $REKOR" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  attempt $i: not recorded yet, retrying in 15s"
            sleep 15
          done
          echo "::error::${PKG}@${VERSION} published WITHOUT provenance (no Rekor entry). The publish itself SUCCEEDED — the version exists and is immutable. Check the OIDC step above, the org/enterprise OIDC policy, and the JSR↔GitHub repo link."
          exit 1

  # npm, a SECOND registry beside JSR (owner, 2026-10-21: "setup an npm repository just as we did
  # for binaryang"): the same tag, after JSR's job, as `@synapticforge1/universal-wasm-loader`.
  # OFF until the repository variable NPM_PUBLISH is `true`, which comes after the first version is
  # published by hand and the npm trusted publisher is configured (cmem/npm.md). Trusted
  # publishing: GitHub OIDC (`id-token: write`), no token; npm >= 11.5 is required for it.
  # Versions are immutable on both registries, so a failed npm job is re-run alone, never re-tagged.
  npm:
    name: Publish ${{ github.ref_name }} to npm
    needs: publish
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        run: |
          git clone --depth=1 --branch ${{ github.ref_name }} \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} .

      - name: Install Bun and dev dependencies
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.3"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          "$HOME/.bun/bin/bun" install --frozen-lockfile

      - name: Install Node 24 and npm 11 (trusted publishing needs npm >= 11.5)
        run: |
          curl -fsSL https://fnm.vercel.app/install | bash -s -- --install-dir "$HOME/.fnm" --skip-shell
          "$HOME/.fnm/fnm" install 24
          "$HOME/.fnm/fnm" exec --using=24 npm install -g npm@11
          "$HOME/.fnm/fnm" exec --using=24 npm --version

      - name: Verify jsr.json version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(jq -r .version jsr.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match jsr.json version ($PKG_VERSION)"
            exit 1
          fi

      # Builds dist/ and proves the tarball (installed and run) before anything is published.
      - name: Build and prove the npm package
        run: '"$HOME/.fnm/fnm" exec --using=24 bun run npm:prove'

      - name: Publish to npm (trusted publishing, provenance)
        working-directory: dist
        run: '"$HOME/.fnm/fnm" exec --using=24 npm publish'

      # The evidence, as for JSR: the attestation read back from the registry, cache-busted.
      - name: Verify provenance was recorded on npm
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          URL="https://registry.npmjs.org/@synapticforge1%2Funiversal-wasm-loader/${VERSION}"
          for i in $(seq 1 12); do
            P=$(curl -sf -H "Cache-Control: no-cache" "${URL}?cb=${GITHUB_RUN_ID}-${i}" | jq -r '.dist.attestations.provenance.predicateType // empty' 2>/dev/null || true)
            if [ -n "$P" ]; then
              echo "npm provenance recorded: $P"
              echo "- npm: @synapticforge1/universal-wasm-loader@${VERSION}, provenance $P" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  attempt $i: not visible yet, retrying in 15s"
            sleep 15
          done
          echo "::error::@synapticforge1/universal-wasm-loader@${VERSION} has no provenance attestation on npm. The version exists and is immutable."
          exit 1
