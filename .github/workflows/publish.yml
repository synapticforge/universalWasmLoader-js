name: Publish

# ONE tag publishes to BOTH registries in ONE run (owner, 2026-10-21: "publishing at different
# times is an issue"): JSR as @jrmarcum/universal-wasm-loader and npm as
# @synapticforge1/universal-wasm-loader, the same code under the same version number.
#
#   verify   everything both publishes need, BEFORE either happens: the tag matches jsr.json, the
#            full gate, the compatibility gate, the npm tarball proved, the JSR dry run, and the
#            version FREE on both registries. Nothing is published here.
#   jsr      after verify: deno publish (OIDC provenance), then the Rekor read-back.
#   npm      after verify, IN PARALLEL with jsr: npm trusted publishing (OIDC, no token), then the
#            attestation read-back. Not switchable off: a skipped npm job is how 1.1.1 reached JSR
#            alone (the NPM_PUBLISH variable gate, removed 2026-10-21).
#   release  after BOTH: the release/<tag> branch and the GitHub Release.
#
# The two registries cannot be published atomically. Everything that can fail on our side fails in
# `verify`, so a split release needs a registry to fail between verify and its own publish; the
# job that failed is then re-run alone ("Re-run failed jobs"; the version is free on that registry,
# taken on the other, and versions are immutable on both, so never re-tag).
#
# workflow_dispatch (tag input) is the RECOVERY path for a registry that missed a release: it
# runs the npm job only, for a tag JSR already has. JSR is never published by dispatch.
#
# NOTE: every step is a plain `run:` step. Under the first owner (`jrmarcum`) a third-party
# `uses:` meant a `startup_failure` with no step run (v1.0.6, 2026-06-15). The repo is in the
# `synapticforge1` organization since 2026-10-21, with the same policy as binaryang there
# (owner); `run:` steps work under any policy.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "RECOVERY: a release tag JSR already has, to publish to npm (e.g. v1.1.1)"
        required: true

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ github.ref_name }} for JSR and npm
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Full history and tags (no --depth): the compatibility gate compares with the previous tag.
      - name: Checkout
        run: |
          git clone --branch ${{ github.ref_name }} \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} .

      # jsr.json is the package manifest since the Bun migration (2026-10-12; deno.json before).
      - name: Verify jsr.json version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(jq -r .version jsr.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match jsr.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Versions match: $TAG_VERSION"

      # Neither registry may already hold this version: a version taken on one is a release that
      # would end up split (both are immutable).
      - name: Version is free on JSR and npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          JSR=$(curl -s -o /dev/null -w '%{http_code}' -H "Cache-Control: no-cache" "https://api.jsr.io/scopes/jrmarcum/packages/universal-wasm-loader/versions/${VERSION}?cb=${GITHUB_RUN_ID}")
          NPM=$(curl -s -o /dev/null -w '%{http_code}' -H "Cache-Control: no-cache" "https://registry.npmjs.org/@synapticforge1%2Funiversal-wasm-loader/${VERSION}?cb=${GITHUB_RUN_ID}")
          echo "JSR ${VERSION}: HTTP ${JSR}; npm ${VERSION}: HTTP ${NPM}"
          if [ "$JSR" != "404" ] || [ "$NPM" != "404" ]; then
            echo "::error::${VERSION} is not free on both registries (JSR ${JSR}, npm ${NPM}; 404 = free)"
            exit 1
          fi

      # The gate is CI's `gates` job, on Bun (the project's runtime since 2026-10-12).
      - name: Install Bun and dev dependencies
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.3"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          "$HOME/.bun/bin/bun" install --frozen-lockfile

      - name: Gate (types, lint, manifest, surface, fixtures, browser, tests)
        run: bun run gate

      # The compatibility gate on the tagged commit (letter H6): the jsr.json bump since the
      # previous tag must meet the surface floor, and for a patch/minor the previous tag's tests
      # must pass against this source.
      - name: Compatibility gate (release)
        run: bun run compat --release

      # The npm tarball, built from this tag, installed into a scratch consumer and run (Node 24 +
      # Bun), before anything is published to either registry.
      - name: npm package (built, packed, installed, run)
        run: |
          curl -fsSL https://fnm.vercel.app/install | bash -s -- --install-dir "$HOME/.fnm" --skip-shell
          "$HOME/.fnm/fnm" install 24
          "$HOME/.fnm/fnm" exec --using=24 bun run npm:prove

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: JSR publish dry run
        run: deno publish --dry-run

  jsr:
    name: Publish ${{ github.ref_name }} to JSR
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        run: |
          git clone --depth=1 --branch ${{ github.ref_name }} \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} .

      # Publishing to JSR still needs Deno: `bunx jsr publish` downloads Deno and runs
      # `deno publish` as a subprocess, which skips the type check when a package.json exists
      # and is the kind of indirection that has lost OIDC provenance before. So `deno publish` is
      # called DIRECTLY; with no deno.json in the repo it reads jsr.json on its own.
      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      # `deno publish` type-checks with tsconfig.json, whose `types: ["node"]` needs @types/node
      # in node_modules: without it the check fails ("Could not find @types/node", measured
      # 2026-10-21 on a tree with no node_modules).
      - name: Install dev dependencies (for deno publish's type check)
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.3"
          "$HOME/.bun/bin/bun" install --frozen-lockfile

      # Provenance requires a GitHub OIDC token; `id-token: write` injects
      # ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN. If they are absent, an org/enterprise OIDC policy is
      # blocking the token and `deno publish` silently skips provenance. A PREREQUISITE only: the
      # read-back below is the real check.
      - name: Check OIDC availability (provenance prerequisite)
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC token endpoint available — provenance prerequisites met."
          else
            echo "::warning::OIDC token NOT available (URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}, TOKEN present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}). deno publish will skip provenance."
          fi

      - name: Publish to JSR
        run: deno publish

      # THE evidence of provenance (design from binaryang/wasmtk): `deno publish` skips attestation
      # non-fatally. JSR caches this endpoint, so every read is cache-busted.
      - name: Verify provenance was recorded on JSR
        run: |
          PKG="$(jq -r .name jsr.json)"
          SCOPE=${PKG%/*}; SCOPE=${SCOPE#@}
          NAME=${PKG#*/}
          VERSION=${GITHUB_REF_NAME#v}
          URL="https://api.jsr.io/scopes/${SCOPE}/packages/${NAME}/versions/${VERSION}"
          echo "Checking $URL"
          for i in $(seq 1 12); do
            BODY=$(curl -sf -H "Accept: application/json" -H "Cache-Control: no-cache" "${URL}?cb=${GITHUB_RUN_ID}-${i}" || true)
            REKOR=$(printf '%s' "$BODY" | jq -r '.rekorLogId // empty' 2>/dev/null || true)
            if [ -n "$REKOR" ]; then
              echo "Provenance recorded — Rekor log ID: $REKOR"
              echo "- JSR: ${PKG}@${VERSION}, Rekor log ID $REKOR" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  attempt $i: not recorded yet, retrying in 15s"
            sleep 15
          done
          echo "::error::${PKG}@${VERSION} published WITHOUT provenance (no Rekor entry). The publish itself SUCCEEDED — the version exists and is immutable. Check the OIDC step above, the org/enterprise OIDC policy, and the JSR↔GitHub repo link."
          exit 1

  npm:
    name: Publish ${{ inputs.tag || github.ref_name }} to npm
    needs: verify
    # A tag push: after verify, beside jsr. A dispatch (recovery): alone, verify skipped.
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && needs.verify.result == 'success') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # The dispatch input reaches the shell only through this variable, never interpolated.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # On a dispatch (recovery) only: a real release tag, which JSR already has and npm lacks.
      - name: Check the recovery tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a release tag: $RELEASE_TAG"
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          if ! curl -sf -H "Cache-Control: no-cache" "https://api.jsr.io/scopes/jrmarcum/packages/universal-wasm-loader/versions/${VERSION}?cb=${GITHUB_RUN_ID}" > /dev/null; then
            echo "::error::JSR has no ${VERSION}: a release starts with the tag push, not here"
            exit 1
          fi
          if curl -sf -H "Cache-Control: no-cache" "https://registry.npmjs.org/@synapticforge1%2Funiversal-wasm-loader/${VERSION}?cb=${GITHUB_RUN_ID}" > /dev/null; then
            echo "::error::npm already has ${VERSION}: nothing to recover"
            exit 1
          fi
          echo "JSR has ${VERSION} and npm does not: publishing it to npm"

      - name: Checkout
        run: |
          git clone --depth=1 --branch "$RELEASE_TAG" \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} .

      - name: Verify jsr.json version matches tag
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PKG_VERSION="$(jq -r .version jsr.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match jsr.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install Bun and dev dependencies
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.3"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          "$HOME/.bun/bin/bun" install --frozen-lockfile

      - name: Install Node 24 and npm 11 (trusted publishing needs npm >= 11.5)
        run: |
          curl -fsSL https://fnm.vercel.app/install | bash -s -- --install-dir "$HOME/.fnm" --skip-shell
          "$HOME/.fnm/fnm" install 24
          "$HOME/.fnm/fnm" exec --using=24 npm install -g npm@11
          "$HOME/.fnm/fnm" exec --using=24 npm --version

      # On a tag push `verify` proved the tarball already; a dispatch proves it here.
      - name: Build (and, on a dispatch, prove) the npm package
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            "$HOME/.fnm/fnm" exec --using=24 bun run npm:prove
          else
            "$HOME/.fnm/fnm" exec --using=24 bun run npm:build
          fi

      - name: Publish to npm (trusted publishing, provenance)
        working-directory: dist
        run: '"$HOME/.fnm/fnm" exec --using=24 npm publish'

      # The evidence, as for JSR: the attestation read back from the registry, cache-busted.
      - name: Verify provenance was recorded on npm
        run: |
          VERSION=${RELEASE_TAG#v}
          URL="https://registry.npmjs.org/@synapticforge1%2Funiversal-wasm-loader/${VERSION}"
          for i in $(seq 1 12); do
            P=$(curl -sf -H "Cache-Control: no-cache" "${URL}?cb=${GITHUB_RUN_ID}-${i}" | jq -r '.dist.attestations.provenance.predicateType // empty' 2>/dev/null || true)
            if [ -n "$P" ]; then
              echo "npm provenance recorded: $P"
              echo "- npm: @synapticforge1/universal-wasm-loader@${VERSION}, provenance $P" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  attempt $i: not visible yet, retrying in 15s"
            sleep 15
          done
          echo "::error::@synapticforge1/universal-wasm-loader@${VERSION} has no provenance attestation on npm. The version exists and is immutable."
          exit 1

  release:
    name: GitHub Release ${{ github.ref_name }}
    needs: [jsr, npm]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        run: |
          git clone --depth=1 --branch ${{ github.ref_name }} \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} .

      - name: Create release branch
        run: |
          git checkout -b release/${GITHUB_REF_NAME}
          git push origin release/${GITHUB_REF_NAME}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${GITHUB_REF_NAME} \
            --title "${GITHUB_REF_NAME}" \
            --target release/${GITHUB_REF_NAME} \
            --generate-notes
